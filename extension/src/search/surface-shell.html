<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfoBoard Tab Search</title>
  <link rel="stylesheet" href="./surface-shell.css">
</head>
<body>
  <div class="search-container">
    <header class="search-header">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="8.5" cy="8.5" r="5.5" />
        <path d="M13 13l4.5 4.5" />
      </svg>
      <input
        id="query"
        data-search-input
        type="search"
        placeholder="Search open tabs (type @ for filters)..."
        data-i18n-placeholder="searchPlaceholder"
        autocomplete="off"
        spellcheck="false"
        aria-autocomplete="list"
        aria-controls="tab-results"
      >
      <div id="search-filter-hint" class="search-filter-hint" aria-hidden="true">
        <span class="hint-prefix" data-i18n="searchHintPrefix">Type</span>
        <kbd class="hint-kbd">@</kbd>
        <span class="hint-suffix" data-i18n="searchHintSuffix">for filters</span>
      </div>
    </header>
    <div id="filter-dropdown" class="filter-dropdown" role="listbox" aria-label="Filter suggestions" hidden></div>

    <main class="results-wrapper">
      <div id="search-notice" class="search-notice" role="status" data-i18n="typoNotice" hidden>Showing closest matches (typo tolerance)</div>
      <ul id="tab-results" class="tab-results" role="listbox" aria-label="Open tabs"></ul>
      <div id="empty-state" class="empty-state" data-i18n="emptyState" hidden>No matching tabs found</div>
    </main>

    <footer class="shortcuts-footer">
      <span class="shortcut-item">
        <kbd class="kbd-key" aria-label="Arrow Up">
          <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </kbd>
        <kbd class="kbd-key" aria-label="Arrow Down">
          <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </kbd>
        <span data-i18n="shortcutNavigate">Navigate</span>
      </span>
      <span class="shortcut-item">
        <kbd class="kbd-key" aria-label="Enter">
          <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 10 4 15 9 20"></polyline>
            <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
          </svg>
        </kbd>
        <span data-i18n="shortcutSwitchTab">Switch tab</span>
      </span>
      <span class="shortcut-item">
        <kbd class="kbd-key kbd-text" aria-label="Alt D">alt+d</kbd>
        <span data-i18n="shortcutCloseTab">Close tab</span>
      </span>
      <span class="shortcut-item">
        <kbd class="kbd-key kbd-text" aria-label="Escape">esc</kbd>
        <span data-i18n="shortcutClose">Close</span>
      </span>
    </footer>
  </div>

  <script type="module" src="../src/search/surface-entrypoint.js"></script>
</body>
</html>
