<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfoBoard Tab Search</title>
  <link rel="stylesheet" href="./surface-shell.css">
</head>
<body>
  <div class="search-container">
    <header class="search-header">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="8.5" cy="8.5" r="5.5" />
        <path d="M13 13l4.5 4.5" />
      </svg>
      <input
        id="query"
        data-search-input
        type="search"
        placeholder="Search open tabs (e.g. t, ti, gh)..."
        autocomplete="off"
        spellcheck="false"
        aria-autocomplete="list"
        aria-controls="tab-results"
      >
    </header>

    <main class="results-wrapper">
      <ul id="tab-results" class="tab-results" role="listbox" aria-label="Open tabs"></ul>
      <div id="empty-state" class="empty-state" hidden>No matching tabs found</div>
    </main>

    <footer class="shortcuts-footer">
      <span class="shortcut-item"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span class="shortcut-item"><kbd>↵</kbd> Switch tab</span>
      <span class="shortcut-item"><kbd>Esc</kbd> Close</span>
    </footer>
  </div>

  <script type="module" src="../src/search/surface-entrypoint.js"></script>
</body>
</html>
