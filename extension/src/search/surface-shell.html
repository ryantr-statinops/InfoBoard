<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfoBoard Search</title>
  <style>
    :root { color-scheme: light; }
    html, body { box-sizing: border-box; width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #fff; color: #151515; font: 16px/1.4 system-ui, sans-serif; }
    main { box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 16px; }
    .surface-header { display: grid; gap: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 10px 12px; border: 2px solid #555; border-radius: 6px; background: #fff; color: inherit; font: inherit; }
    input:focus-visible, button:focus-visible, .result-row:focus-visible { outline: 3px solid #1463d5; outline-offset: 2px; }
    [data-search-ready="true"] input { border-color: #1463d5; }
    [data-surface-status] { min-height: 1.4em; margin: 0; color: #3c3c3c; }
    [data-surface-status]:empty { display: none; }
    .empty-state { margin: 0; color: #4a4a4a; overflow-wrap: anywhere; }
    .results { box-sizing: border-box; flex: 1 1 auto; min-height: 0; margin: 0; padding: 0; overflow-y: auto; list-style: none; border: 1px solid #c9c9c9; border-radius: 6px; }
    .results[hidden] { display: none; }
    .result-row { display: grid; gap: 3px; padding: 10px 12px; border-bottom: 1px solid #e5e5e5; overflow-wrap: anywhere; }
    .result-row:last-child { border-bottom: 0; }
    .result-row[aria-selected="true"] { background: #e8f0fe; box-shadow: inset 4px 0 0 #1463d5; }
    .result-title { font-weight: 600; }
    .result-context, .result-explanation { color: #4a4a4a; font-size: 0.875rem; }
    .result-pin { justify-self: start; padding: 0 6px; border: 1px solid #555; border-radius: 999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hint { color: #4a4a4a; font-size: 0.8125rem; }
    button { min-height: 44px; padding: 8px 12px; border: 1px solid #555; border-radius: 6px; background: #f7f7f7; color: inherit; font: inherit; }
    @media (max-width: 360px) {
      main { padding: 12px; gap: 8px; }
      .footer .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main data-surface-root>
    <div class="surface-header">
      <label class="sr-only" for="query">Search open tabs</label>
      <input id="query" data-search-input type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="surface-results" aria-describedby="surface-help surface-status" autocomplete="off" spellcheck="false">
      <p id="surface-help" class="hint">Type to filter open tabs. Use arrow keys and Enter.</p>
    </div>
    <p id="surface-status" data-surface-status role="status" aria-live="polite" aria-atomic="true"></p>
    <p data-empty-state class="empty-state" hidden></p>
    <ul id="surface-results" data-result-list role="listbox" aria-label="Open tab results" hidden></ul>
    <div class="footer">
      <span class="hint">Esc closes without changing tabs</span>
      <button type="button" data-close-search>Close search</button>
    </div>
  </main>
  <script type="module" src="../src/search/surface-entrypoint.js"></script>
</body>
</html>
