<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>InfoBoard</title><style>body{font:16px system-ui;margin:0;background:#f5f7fb;color:#182230}header{padding:20px 5%;background:#172554;color:white}main{max-width:1100px;margin:24px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001}input,button{padding:10px;border:1px solid #ccd3df;border-radius:8px}input{width:70%}</style></head><body><header><h1>InfoBoard</h1><p>Information dashboard local-first</p></header><main><form action="/" method="get"><input name="q" value="{{ q }}" placeholder="Tìm kiếm thông tin..."><button>Tìm</button></form><p>{{ count }} items · {{ chunks }} chunks</p><section class="grid">{% for item in items %}<article class="card"><h2>{{ item.title }}</h2><small>{{ item.source_type }} · {{ item.created_at }}</small><p>{{ item.excerpt or '' }}</p></article>{% else %}<article class="card">Chưa có thông tin nào.</article>{% endfor %}</section></main></body></html>
